name: Deploy sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
      - name: Assemble site
        run: scripts/assemble-site.sh
      - name: Publish to web-locks.github.io
        # GITHUB_TOKEN cannot push to another repository, so this uses a
        # fine-grained PAT (Contents: read and write on web-locks.github.io only).
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: web-locks/web-locks.github.io
          publish_branch: main
          publish_dir: ./site
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          full_commit_message: "deploy: ${{ github.sha }}"
